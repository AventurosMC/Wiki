[project]
site_name = "Wiki Aventuros"
site_url = "https://wiki.aventuros.fr/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
copyright = 'Contenu sous licence <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 4.0</a> · <a href="https://github.com/AventurosMC/Wiki" target="_blank" rel="noopener">Contributeurs</a>'
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Retour vers le site principal" = "https://aventuros.fr/" },
  "index.md",
  { "En jeu" = [
    "en-jeu/commandes.md",
    "en-jeu/grades.md",
    "en-jeu/items.md",
    "en-jeu/minerais.md",
  ] },
  { "Launcher" = [
    "launcher/aide-install.md",
  ] },
]

[project.theme]
language = "fr"
favicon = "images/favicon.png"
# Fonts are not loaded from Google Fonts, so the site needs no third-party origin.
font = false
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode clair"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences = {}
